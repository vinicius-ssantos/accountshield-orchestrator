spring:
  application:
    name: accountshield-orchestrator
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/accountshield}
    username: ${DATABASE_USERNAME:accountshield}
    password: ${DATABASE_PASSWORD:accountshield-local-only}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]"

accountshield:
  challenge:
    hmac-secret: ${CHALLENGE_HMAC_SECRET:accountshield-local-only-challenge-secret}
    simulation-enabled: ${CHALLENGE_SIMULATION_ENABLED:true}
    retention:
      terminal-ttl: 1d
      fixed-delay: 1h
  protection:
    rate-limit:
      max-requests: 10
      window: 60s
    idempotency:
      ttl: 24h
      retention:
        batch-size: 500
        fixed-delay: 1h
  outbox:
    relay:
      fixed-delay: 5s
      batch-size: 50
      max-attempts: 5
      claim-timeout: 2m
      backoff:
        base-delay: 1s
        max-delay: 5m
    retention:
      published-ttl: 7d
      dead-lettered-ttl: 30d
      batch-size: 500
      fixed-delay: 1h
  privacy:
    pseudonym-secret: ${ACCOUNT_PSEUDONYM_SECRET:accountshield-local-only-pseudonym-secret}
  webhook:
    secret-encryption-key: ${ACCOUNTSHIELD_WEBHOOK_SECRET_ENCRYPTION_KEY:accountshield-local-only-webhook-secret-key}
    delivery:
      timeout: 5s
    demo-receiver:
      secret: ${ACCOUNTSHIELD_WEBHOOK_DEMO_RECEIVER_SECRET:accountshield-local-only-demo-receiver-secret}
      max-timestamp-skew: 5m
  crypto:
    active-kek-version: ${ACCOUNTSHIELD_CRYPTO_ACTIVE_KEK_VERSION:1}
    active-kek-secret: ${ACCOUNTSHIELD_CRYPTO_ACTIVE_KEK_SECRET:accountshield-local-only-kek-v1}
    previous-kek-version: ${ACCOUNTSHIELD_CRYPTO_PREVIOUS_KEK_VERSION:0}
    previous-kek-secret: ${ACCOUNTSHIELD_CRYPTO_PREVIOUS_KEK_SECRET:}
    subject-id-secret: ${ACCOUNTSHIELD_CRYPTO_SUBJECT_ID_SECRET:accountshield-local-only-subject-id-secret}
    rewrap:
      batch-size: 200
      fixed-delay: 1h
  risk:
    max-signal-age: 5m
  policy:
    impact:
      max-divergence-percentage: 20
  recovery:
    retention:
      terminal-ttl: 30d
      fixed-delay: 1h
  audit:
    chain:
      verification:
        batch-size: 500
        fixed-delay: 1h
  evidence:
    signing:
      key-size: 2048
