# Default tries for every jqwik @Property in this suite (ADR 0033): bounded enough to keep the
# default CI gate fast; nightly.yml overrides this via -Djqwik.tries.default for deeper fuzzing
# (issue #53's "CI runs a stable bounded suite; deeper fuzzing runs on a scheduled workflow").
# jqwik.properties (the old, pre-1.6 config file) is no longer read -- this is the current,
# supported mechanism: JUnit Platform's own config file, with jqwik reading its keys prefixed
# with "jqwik.".
jqwik.tries.default=200
