spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true

management:
  otlp:
    tracing:
      export:
        enabled: false

accountshield:
  outbox:
    relay:
      fixed-delay: 9999s
    retention:
      fixed-delay: 9999s
  challenge:
    retention:
      fixed-delay: 9999s
  recovery:
    retention:
      fixed-delay: 9999s
    authorization-retention:
      fixed-delay: 9999s
  protection:
    idempotency:
      retention:
        fixed-delay: 9999s
  crypto:
    previous-kek-version: 99
    previous-kek-secret: goEZxqNx2f+pk0Ap23Q+fpE0ae7q4uHRCTbKasd5HR4=
    rewrap:
      fixed-delay: 9999s
  audit:
    chain:
      verification:
        fixed-delay: 9999s
