spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-migration-naming: true

accountshield:
  outbox:
    relay:
      fixed-delay: 9999s
    retention:
      fixed-delay: 9999s
  challenge:
    retention:
      fixed-delay: 9999s
  recovery:
    retention:
      fixed-delay: 9999s
    authorization-retention:
      fixed-delay: 9999s
  protection:
    idempotency:
      retention:
        fixed-delay: 9999s
  crypto:
    previous-kek-version: 99
    previous-kek-secret: accountshield-local-only-kek-v99-test
    rewrap:
      fixed-delay: 9999s
  audit:
    chain:
      verification:
        fixed-delay: 9999s
