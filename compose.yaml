services:
  postgres:
    image: postgres:17-alpine
    container_name: accountshield-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accountshield}
      POSTGRES_USER: ${POSTGRES_USER:-accountshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accountshield-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - accountshield-postgres:/var/lib/postgresql/data

  app:
    build: .
    container_name: accountshield-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-accountshield}
      DATABASE_USERNAME: ${POSTGRES_USER:-accountshield}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-accountshield-local-only}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
        ACCOUNTSHIELD_DATA_SOURCE: ${ACCOUNTSHIELD_DATA_SOURCE:-fixtures}
    container_name: accountshield-frontend
    depends_on:
      app:
        condition: service_started
    environment:
      ACCOUNTSHIELD_API_URL: http://app:8080
      ACCOUNTSHIELD_DATA_SOURCE: ${ACCOUNTSHIELD_DATA_SOURCE:-fixtures}
      ACCOUNTSHIELD_BFF_TIMEOUT_MS: ${ACCOUNTSHIELD_BFF_TIMEOUT_MS:-2000}
      ACCOUNTSHIELD_BFF_MAX_RESPONSE_BYTES: ${ACCOUNTSHIELD_BFF_MAX_RESPONSE_BYTES:-32768}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: accountshield-prometheus
    depends_on:
      - app
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: accountshield-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/accountshield-dashboard.json:/var/lib/grafana/dashboards/accountshield-dashboard.json:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  accountshield-postgres:
