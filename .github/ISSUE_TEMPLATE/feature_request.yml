name: Feature or hardening request
description: Propose new scope, following docs/roadmap.md's priority model
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        See `docs/roadmap.md`'s priority model (P0-P3) and `docs/architecture/README.md` before
        proposing new scope. This project does not introduce microservices, Kafka, machine
        learning, or real challenge providers without an accepted issue and ADR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or risk does this address? Reference the feature catalog
        (`docs/features/README.md`) status if relevant.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0: a documented security invariant can be bypassed"
        - "P1: correctness, concurrency, authorization, data-protection, or reliability gap"
        - "P2: production-like operational maturity and platform evolution"
        - "P3: quality gates, governance, release, and presentation"
    validations:
      required: true
