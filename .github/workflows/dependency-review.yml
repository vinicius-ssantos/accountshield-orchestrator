name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Blocks only NEW additions in this PR's diff at high/critical severity -- unlike
      # coverage/lint thresholds, this needs no pre-existing baseline to be a safe hard gate
      # (ADR 0031).
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
