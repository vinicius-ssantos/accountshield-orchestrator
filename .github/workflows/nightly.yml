name: Nightly full test suite

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  full-verify:
    name: Maven verify (full suite, including resilience)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # accountshield-sdk is a standalone Maven project this build's test scope depends on
      # (issue #55, ADR 0037: SdkContractVerificationTest) -- must be installed into the local
      # repo before this job's own independent `mvn verify` can resolve it.
      - name: Build and install accountshield-sdk module
        run: |
          cd sdk
          mvn --batch-mode --no-transfer-progress install -DskipTests

      # accountshield-cli (issue #56, ADR 0038) must be assembled (not just installed) since
      # CliEndToEndTest below runs the jar itself as a real subprocess.
      - name: Build accountshield-cli module
        run: |
          cd cli
          mvn --batch-mode --no-transfer-progress package -DskipTests

      # No -DexcludedGroups here, unlike ci.yml's default gate (ADR 0032): this is the "nightly
      # workflows run the full suite" half of issue #39's acceptance criterion, exercising the
      # slower fault-injection (Toxiproxy) scenarios ci.yml's default gate skips, plus the
      # measurement-grade "benchmark"-tagged capacity suite (issue #50, ADR 0035) and the
      # "disaster-recovery"-tagged backup/restore drill (issue #51, ADR 0036). -Djqwik.tries
      # .default overrides src/test/resources/junit-platform.properties' bounded default (200)
      # for deeper property-based fuzzing (issue #53, ADR 0033).
      - name: Verify (full suite, deeper property-based fuzzing)
        run: mvn --batch-mode --no-transfer-progress verify -Djqwik.tries.default=2000

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-benchmark-report
          path: target/benchmark-reports/**
          retention-days: 90

      - name: Upload disaster recovery drill report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: disaster-recovery-report
          path: target/dr-reports/**
          retention-days: 90

      - name: Summarize test failure causes
        if: failure()
        shell: bash
        run: |
          if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
            grep -h -E "^(Caused by:|[[:space:]]*Caused by:|\[ERROR\]|org\.flywaydb|jakarta\.persistence|org\.springframework\.beans)" \
              target/surefire-reports/*.txt | head -n 250 || true
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-surefire-reports
          path: target/surefire-reports/**
          retention-days: 14
