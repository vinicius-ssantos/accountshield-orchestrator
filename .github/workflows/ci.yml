name: CI

on:
  push:
    branches: [main, integration/frontend-console]
  pull_request:
    branches: [main, integration/frontend-console]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Issue #55 (ADR 0037): accountshield-sdk is a standalone Maven project (no parent/reactor
      # relationship to this pom.xml -- see sdk/pom.xml's own comment) that this build's own test
      # suite depends on (test scope, SdkContractVerificationTest) to prove the SDK's typed models
      # against a live instance of this server. It must be built and installed into the local repo
      # before "Verify" below can resolve it. demo/ is built here too (package, not install) purely
      # to catch a compile break early; the docker job below is what actually runs it end to end.
      - name: Build and test accountshield-sdk module
        run: |
          cd sdk
          mvn --batch-mode --no-transfer-progress install

      - name: Build accountshield-demo module
        run: |
          cd demo
          mvn --batch-mode --no-transfer-progress package

      # Issue #56 (ADR 0038): accountshield-cli is a standalone Maven project depending only on
      # accountshield-sdk. "Verify" below's CliEndToEndTest runs the assembled jar built here as a
      # real subprocess against a live test server -- the jar must exist on disk first.
      - name: Build and test accountshield-cli module
        run: |
          cd cli
          mvn --batch-mode --no-transfer-progress package

      # "resilience"-tagged tests (fault-injection: real container startup, connection-timeout
      # waits) are excluded from this default gate and run in full every night instead
      # (nightly.yml, ADR 0032) -- the stable/default subset vs. full-suite split issue #39 asks
      # for. "benchmark"-tagged tests (issue #50, ADR 0035: measurement-grade capacity numbers,
      # tens of seconds each) are excluded the same way; a small untagged
      # CapacitySmokeBenchmarkTest still runs here, proving the harness itself works on every PR
      # without gating on noisy shared-runner timing. "disaster-recovery"-tagged tests (issue #51,
      # ADR 0036: a real pg_dump/psql backup-and-restore drill against a second Testcontainers
      # Postgres instance, tens of seconds) are excluded the same way, run nightly only.
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify -DexcludedGroups=resilience,benchmark,disaster-recovery

      - name: Assemble generated contracts
        if: always()
        shell: bash
        run: |
          mkdir -p target/contracts
          cp docs/contracts/asyncapi.yaml target/contracts/asyncapi.yaml

      - name: Upload generated contracts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contracts
          path: target/contracts/**
          retention-days: 90

      # Coverage reporting only for now (ADR 0031): no hard-failing threshold, since no real
      # baseline coverage number has ever been observed for this codebase. Report is uploaded
      # here so a real number can be established, then thresholds phased in as a follow-up.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/**
          retention-days: 90

      # Issue #54 (ADR 0034): the adversarial account-takeover scenario lab's decision-timeline
      # report -- "results can feed demo dashboards".
      - name: Upload scenario lab report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scenario-lab-report
          path: target/scenario-reports/**
          retention-days: 90

      # Issue #50 (ADR 0035): CapacitySmokeBenchmarkTest's tiny report, produced on every PR --
      # the full measurement-grade benchmark reports (target/benchmark-reports/*.md, same
      # directory) only exist on the nightly workflow, where the "benchmark"-tagged suite runs.
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-report
          path: target/benchmark-reports/**
          retention-days: 90

      # Real per-tag GitHub Release attachment deferred: no tags/releases exist yet in this repo
      # (ADR 0031, mirrors ADR 0029's identical bootstrap reasoning for contract baselines).
      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: |
            target/bom.xml
            target/bom.json
          retention-days: 90

      - name: Summarize test failure causes
        if: failure()
        shell: bash
        run: |
          if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
            grep -h -E "^(Caused by:|[[:space:]]*Caused by:|\[ERROR\]|org\.flywaydb|jakarta\.persistence|org\.springframework\.beans)" \
              target/surefire-reports/*.txt | head -n 250 || true
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          retention-days: 7

  # Self-hosted fallback for "Maven verify" (a required status check). Races the
  # hosted job above via the shared concurrency group: whichever runner claims the
  # group first cancels the other, so this only actually does work when the
  # GitHub-hosted runner is unavailable (queued/outage) long enough for the local
  # runner to grab the group first. Trimmed to the essentials (no report/SBOM
  # artifact uploads) since its only job is to satisfy the required check quickly;
  # the hosted job remains the rich-reporting default the rest of the time.
  verify-self-hosted:
    name: Maven verify (self-hosted)
    runs-on: [self-hosted, accountshield-ci]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test accountshield-sdk module
        run: |
          cd sdk
          mvn --batch-mode --no-transfer-progress install

      - name: Build accountshield-demo module
        run: |
          cd demo
          mvn --batch-mode --no-transfer-progress package

      - name: Build and test accountshield-cli module
        run: |
          cd cli
          mvn --batch-mode --no-transfer-progress package

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify -DexcludedGroups=resilience,benchmark,disaster-recovery

      - name: Summarize test failure causes
        if: failure()
        shell: bash
        run: |
          if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
            grep -h -E "^(Caused by:|[[:space:]]*Caused by:|\[ERROR\]|org\.flywaydb|jakarta\.persistence|org\.springframework\.beans)" \
              target/surefire-reports/*.txt | head -n 250 || true
          fi

  frontend:
    name: Frontend verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCOUNTSHIELD_DATA_SOURCE: fixtures
      NEXT_PUBLIC_APP_ENV: ci

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install declared npm version
        run: npm install --global npm@11.4.2 --no-audit --no-fund

      - name: Validate lockfile metadata and sources
        run: |
          node <<'NODE'
          const lock = require("./package-lock.json");
          if (lock.lockfileVersion !== 3) {
            throw new Error(`Expected lockfileVersion 3, found ${lock.lockfileVersion}`);
          }
          if (lock.packages?.[""]?.name !== "accountshield-console") {
            throw new Error("Unexpected root package in package-lock.json");
          }
          const invalidSources = Object.entries(lock.packages ?? {})
            .filter(([, metadata]) => metadata?.resolved)
            .filter(([, metadata]) => !metadata.resolved.startsWith("https://registry.npmjs.org/"))
            .map(([name, metadata]) => `${name}: ${metadata.resolved}`);
          if (invalidSources.length > 0) {
            throw new Error(`Unexpected package sources:\n${invalidSources.join("\n")}`);
          }
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Next.js types
        run: npm run typegen

      - name: Verify generated OpenAPI client
        run: npm run openapi:check

      - name: Test architecture rule engine
        run: npm run architecture:test

      - name: Enforce frontend architecture boundaries
        run: npm run architecture:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: npm run budget:check

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-test-reports
          path: |
            frontend/coverage/**
            frontend/test-results/vitest-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-e2e:
    name: Frontend browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend
    env:
      ACCOUNTSHIELD_DATA_SOURCE: fixtures
      NEXT_PUBLIC_APP_ENV: test

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install declared npm version
        run: npm install --global npm@11.4.2 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production frontend
        run: npm run build

      - name: Run Playwright and accessibility tests
        run: npm run test:e2e

      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-test-artifacts
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, frontend]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Issue #55 (ADR 0037): this job runs on a fresh runner (no local Maven repo carried over
      # from the verify job), so accountshield-sdk and accountshield-demo are rebuilt here purely
      # to produce the demo's runnable jar, used below for the real end-to-end flow check.
      - name: Set up Java 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build accountshield-sdk and accountshield-demo modules
        run: |
          cd sdk && mvn --batch-mode --no-transfer-progress install -DskipTests
          cd ../demo && mvn --batch-mode --no-transfer-progress package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: accountshield-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Advisory only for now (ADR 0031): no known current-vulnerability baseline for the base
      # images this Dockerfile uses, so this does not fail the build yet -- results still appear
      # in the repository's code scanning tab. Revisit once a baseline is established.
      - name: Scan image for known vulnerabilities (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: accountshield-orchestrator:ci
          format: sarif
          output: trivy-image-results.sarif
          exit-code: "0"

      - name: Upload image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      # Container smoke test: the image must actually start and serve traffic, not just build.
      # Plain docker network + docker run (not docker compose) so the health check can curl from
      # the runner itself -- the app image's minimal JRE base is not guaranteed to have curl/wget
      # installed, but every GitHub-hosted ubuntu-latest runner does.
      - name: Start smoke test database and app
        run: |
          docker network create accountshield-smoke-net
          docker run -d --name accountshield-smoke-postgres --network accountshield-smoke-net \
            -e POSTGRES_DB=accountshield -e POSTGRES_USER=accountshield \
            -e POSTGRES_PASSWORD=accountshield-local-only \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec accountshield-smoke-postgres pg_isready -U accountshield -d accountshield && break
            sleep 2
          done
          # SPRING_PROFILES_ACTIVE=local (issue #55, ADR 0037): enables the local/demo-only
          # /dev/tokens endpoint (SecurityConfig permits it anonymously only under this profile),
          # which the SDK demo below uses to self-mint a bearer token -- every real endpoint it
          # calls sits behind this server's JWT resource server (ADR 0011).
          docker run -d --name accountshield-smoke-app --network accountshield-smoke-net -p 8080:8080 \
            -e DATABASE_URL=jdbc:postgresql://accountshield-smoke-postgres:5432/accountshield \
            -e DATABASE_USERNAME=accountshield -e DATABASE_PASSWORD=accountshield-local-only \
            -e SPRING_PROFILES_ACTIVE=local \
            accountshield-orchestrator:ci

      - name: Wait for the app to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Smoke test passed: /actuator/health reports UP"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed: /actuator/health never reported UP within 60s"
          exit 1

      # Issue #55 (ADR 0037): "CI validates the end-to-end flow" -- runs the real SDK demo (built
      # above) against the real, already-running smoke-test app container, submitting real
      # protection decisions and exercising the challenge/recovery/webhook-verification paths. A
      # non-zero exit fails this job.
      - name: Run SDK demo end-to-end against the live smoke-test app
        run: |
          ACCOUNTSHIELD_BASE_URL=http://localhost:8080 java -jar demo/target/accountshield-demo.jar

      - name: Smoke test logs on failure
        if: failure()
        run: |
          docker logs accountshield-smoke-app || true
          docker logs accountshield-smoke-postgres || true

      - name: Tear down smoke test containers
        if: always()
        run: |
          docker rm -f accountshield-smoke-app accountshield-smoke-postgres || true
          docker network rm accountshield-smoke-net || true

  # Self-hosted fallback for "Docker build" (a required status check), same rationale as
  # verify-self-hosted above. Deliberately does NOT `need:` verify/frontend -- those hosted
  # jobs may themselves be stuck during an outage, and this job's own steps already rebuild
  # everything it needs from a clean checkout, so waiting on them would just reintroduce the
  # outage dependency this job exists to route around.
  docker-self-hosted:
    name: Docker build (self-hosted)
    runs-on: [self-hosted, accountshield-ci]
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build accountshield-sdk and accountshield-demo modules
        run: |
          cd sdk && mvn --batch-mode --no-transfer-progress install -DskipTests
          cd ../demo && mvn --batch-mode --no-transfer-progress package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: accountshield-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start smoke test database and app
        run: |
          docker network create accountshield-smoke-net
          docker run -d --name accountshield-smoke-postgres --network accountshield-smoke-net \
            -e POSTGRES_DB=accountshield -e POSTGRES_USER=accountshield \
            -e POSTGRES_PASSWORD=accountshield-local-only \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec accountshield-smoke-postgres pg_isready -U accountshield -d accountshield && break
            sleep 2
          done
          docker run -d --name accountshield-smoke-app --network accountshield-smoke-net -p 8080:8080 \
            -e DATABASE_URL=jdbc:postgresql://accountshield-smoke-postgres:5432/accountshield \
            -e DATABASE_USERNAME=accountshield -e DATABASE_PASSWORD=accountshield-local-only \
            -e SPRING_PROFILES_ACTIVE=local \
            accountshield-orchestrator:ci

      - name: Wait for the app to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Smoke test passed: /actuator/health reports UP"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed: /actuator/health never reported UP within 60s"
          exit 1

      - name: Run SDK demo end-to-end against the live smoke-test app
        run: |
          ACCOUNTSHIELD_BASE_URL=http://localhost:8080 java -jar demo/target/accountshield-demo.jar

      - name: Smoke test logs on failure
        if: failure()
        run: |
          docker logs accountshield-smoke-app || true
          docker logs accountshield-smoke-postgres || true

      - name: Tear down smoke test containers
        if: always()
        run: |
          docker rm -f accountshield-smoke-app accountshield-smoke-postgres || true
          docker network rm accountshield-smoke-net || true

  frontend-container:
    name: Frontend container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: accountshield-frontend:ci
          build-args: |
            NEXT_PUBLIC_APP_ENV=ci
            ACCOUNTSHIELD_DATA_SOURCE=fixtures
          cache-from: type=gha,scope=frontend-container
          cache-to: type=gha,mode=max,scope=frontend-container

      - name: Start frontend container
        run: |
          docker network create accountshield-ci
          docker run --detach --name app --network accountshield-ci node:22-alpine \
            node -e "require('node:http').createServer((request,response)=>{response.writeHead(200,{'content-type':'application/json'});response.end(JSON.stringify({status:'ok'}));}).listen(8080,'0.0.0.0')"
          docker run --detach --name accountshield-frontend-ci \
            --network accountshield-ci \
            --publish 127.0.0.1:3001:3000 \
            --env ACCOUNTSHIELD_API_URL=http://app:8080 \
            --env ACCOUNTSHIELD_DATA_SOURCE=fixtures \
            --env NEXT_PUBLIC_APP_ENV=ci \
            accountshield-frontend:ci

      - name: Verify frontend container
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs accountshield-frontend-ci
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3001/ \
            | grep --fixed-strings "Account protection at a glance"

          test "$(docker exec accountshield-frontend-ci id -u)" != "0"
          docker exec accountshield-frontend-ci node -e \
            "fetch(process.env.ACCOUNTSHIELD_API_URL + '/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"

          health_status=""
          for attempt in $(seq 1 15); do
            health_status="$(docker inspect --format='{{.State.Health.Status}}' accountshield-frontend-ci)"
            if [ "$health_status" = "healthy" ]; then
              break
            fi
            if [ "$health_status" = "unhealthy" ]; then
              docker logs accountshield-frontend-ci
              exit 1
            fi
            sleep 1
          done
          test "$health_status" = "healthy"

      - name: Reject build and runtime mode mismatch
        run: bash frontend/scripts/assert-runtime-mismatch.sh

      - name: Show frontend container logs on failure
        if: failure()
        run: docker logs accountshield-frontend-ci || true

      - name: Remove smoke containers and network
        if: always()
        run: |
          docker rm --force accountshield-frontend-ci app || true
          docker network rm accountshield-ci || true
