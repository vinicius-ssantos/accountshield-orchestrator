name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Issue #55 (ADR 0037): accountshield-sdk is a standalone Maven project (no parent/reactor
      # relationship to this pom.xml -- see sdk/pom.xml's own comment) that this build's own test
      # suite depends on (test scope, SdkContractVerificationTest) to prove the SDK's typed models
      # against a live instance of this server. It must be built and installed into the local repo
      # before "Verify" below can resolve it. demo/ is built here too (package, not install) purely
      # to catch a compile break early; the docker job below is what actually runs it end to end.
      - name: Build and test accountshield-sdk module
        run: |
          cd sdk
          mvn --batch-mode --no-transfer-progress install

      - name: Build accountshield-demo module
        run: |
          cd demo
          mvn --batch-mode --no-transfer-progress package

      # "resilience"-tagged tests (fault-injection: real container startup, connection-timeout
      # waits) are excluded from this default gate and run in full every night instead
      # (nightly.yml, ADR 0032) -- the stable/default subset vs. full-suite split issue #39 asks
      # for. "benchmark"-tagged tests (issue #50, ADR 0035: measurement-grade capacity numbers,
      # tens of seconds each) are excluded the same way; a small untagged
      # CapacitySmokeBenchmarkTest still runs here, proving the harness itself works on every PR
      # without gating on noisy shared-runner timing. "disaster-recovery"-tagged tests (issue #51,
      # ADR 0036: a real pg_dump/psql backup-and-restore drill against a second Testcontainers
      # Postgres instance, tens of seconds) are excluded the same way, run nightly only.
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify -DexcludedGroups=resilience,benchmark,disaster-recovery

      - name: Assemble generated contracts
        if: always()
        shell: bash
        run: |
          mkdir -p target/contracts
          cp docs/contracts/asyncapi.yaml target/contracts/asyncapi.yaml

      - name: Upload generated contracts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contracts
          path: target/contracts/**
          retention-days: 90

      # Coverage reporting only for now (ADR 0031): no hard-failing threshold, since no real
      # baseline coverage number has ever been observed for this codebase. Report is uploaded
      # here so a real number can be established, then thresholds phased in as a follow-up.
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/**
          retention-days: 90

      # Issue #54 (ADR 0034): the adversarial account-takeover scenario lab's decision-timeline
      # report -- "results can feed demo dashboards".
      - name: Upload scenario lab report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-lab-report
          path: target/scenario-reports/**
          retention-days: 90

      # Issue #50 (ADR 0035): CapacitySmokeBenchmarkTest's tiny report, produced on every PR --
      # the full measurement-grade benchmark reports (target/benchmark-reports/*.md, same
      # directory) only exist on the nightly workflow, where the "benchmark"-tagged suite runs.
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: target/benchmark-reports/**
          retention-days: 90

      # Real per-tag GitHub Release attachment deferred: no tags/releases exist yet in this repo
      # (ADR 0031, mirrors ADR 0029's identical bootstrap reasoning for contract baselines).
      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            target/bom.xml
            target/bom.json
          retention-days: 90

      - name: Summarize test failure causes
        if: failure()
        shell: bash
        run: |
          if compgen -G "target/surefire-reports/*.txt" > /dev/null; then
            grep -h -E "^(Caused by:|[[:space:]]*Caused by:|\[ERROR\]|org\.flywaydb|jakarta\.persistence|org\.springframework\.beans)" \
              target/surefire-reports/*.txt | head -n 250 || true
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Issue #55 (ADR 0037): this job runs on a fresh runner (no local Maven repo carried over
      # from the verify job), so accountshield-sdk and accountshield-demo are rebuilt here purely
      # to produce the demo's runnable jar, used below for the real end-to-end flow check.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build accountshield-sdk and accountshield-demo modules
        run: |
          cd sdk && mvn --batch-mode --no-transfer-progress install -DskipTests
          cd ../demo && mvn --batch-mode --no-transfer-progress package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: accountshield-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Advisory only for now (ADR 0031): no known current-vulnerability baseline for the base
      # images this Dockerfile uses, so this does not fail the build yet -- results still appear
      # in the repository's code scanning tab. Revisit once a baseline is established.
      - name: Scan image for known vulnerabilities (advisory)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: accountshield-orchestrator:ci
          format: sarif
          output: trivy-image-results.sarif
          exit-code: "0"

      - name: Upload image scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      # Container smoke test: the image must actually start and serve traffic, not just build.
      # Plain docker network + docker run (not docker compose) so the health check can curl from
      # the runner itself -- the app image's minimal JRE base is not guaranteed to have curl/wget
      # installed, but every GitHub-hosted ubuntu-latest runner does.
      - name: Start smoke test database and app
        run: |
          docker network create accountshield-smoke-net
          docker run -d --name accountshield-smoke-postgres --network accountshield-smoke-net \
            -e POSTGRES_DB=accountshield -e POSTGRES_USER=accountshield \
            -e POSTGRES_PASSWORD=accountshield-local-only \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec accountshield-smoke-postgres pg_isready -U accountshield -d accountshield && break
            sleep 2
          done
          # SPRING_PROFILES_ACTIVE=local (issue #55, ADR 0037): enables the local/demo-only
          # /dev/tokens endpoint (SecurityConfig permits it anonymously only under this profile),
          # which the SDK demo below uses to self-mint a bearer token -- every real endpoint it
          # calls sits behind this server's JWT resource server (ADR 0011).
          docker run -d --name accountshield-smoke-app --network accountshield-smoke-net -p 8080:8080 \
            -e DATABASE_URL=jdbc:postgresql://accountshield-smoke-postgres:5432/accountshield \
            -e DATABASE_USERNAME=accountshield -e DATABASE_PASSWORD=accountshield-local-only \
            -e SPRING_PROFILES_ACTIVE=local \
            accountshield-orchestrator:ci

      - name: Wait for the app to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Smoke test passed: /actuator/health reports UP"
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed: /actuator/health never reported UP within 60s"
          exit 1

      # Issue #55 (ADR 0037): "CI validates the end-to-end flow" -- runs the real SDK demo (built
      # above) against the real, already-running smoke-test app container, submitting real
      # protection decisions and exercising the challenge/recovery/webhook-verification paths. A
      # non-zero exit fails this job.
      - name: Run SDK demo end-to-end against the live smoke-test app
        run: |
          ACCOUNTSHIELD_BASE_URL=http://localhost:8080 java -jar demo/target/accountshield-demo.jar

      - name: Smoke test logs on failure
        if: failure()
        run: |
          docker logs accountshield-smoke-app || true
          docker logs accountshield-smoke-postgres || true

      - name: Tear down smoke test containers
        if: always()
        run: |
          docker rm -f accountshield-smoke-app accountshield-smoke-postgres || true
          docker network rm accountshield-smoke-net || true
